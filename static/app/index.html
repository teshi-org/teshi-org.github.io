<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Teshi — AI Testing Agent</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1a1a;
        overflow: hidden;
      }
      #terminal {
        display: flex;
        flex-direction: column;
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
        background: #111;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        width: calc(100vw - 32px);
        height: calc(100vh - 32px);
      }
      #terminal-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: #222;
        border-bottom: 1px solid #333;
        user-select: none;
        flex-shrink: 0;
      }
      .term-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .term-dot:nth-child(1) {
        background: #ff5f56;
      }
      .term-dot:nth-child(2) {
        background: #ffbd2e;
      }
      .term-dot:nth-child(3) {
        background: #27c93f;
      }
      #terminal-title {
        margin-left: auto;
        font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
        font-size: 11px;
        color: #666;
      }
      #terminal-body {
        font-family:
          "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
        font-size: 16px;
        line-height: 20px;
        letter-spacing: 0;
        word-spacing: 0;
        white-space: pre;
        background: #111;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      #terminal-body pre {
        display: block;
        margin: 0;
        padding: 0;
        line-height: 20px;
        height: 20px;
        overflow: hidden;
      }
      #terminal-body span {
        display: inline-block;
        white-space: pre;
        vertical-align: middle;
      }

      /* Loading splash */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a1a1a;
        color: #d4d4d4;
        font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
        pointer-events: none;
      }
      #splash.fade {
        opacity: 0;
        visibility: hidden;
      }
      .splash-logo {
        width: 56px;
        height: 56px;
        border-radius: 22%;
        margin-bottom: 20px;
        opacity: 0.85;
        animation: splashPulse 1.8s ease-in-out infinite;
      }
      .splash-status {
        font-size: 12px;
        color: #555;
        letter-spacing: 0.08em;
        margin-bottom: 16px;
        min-height: 1.2em;
      }
      .splash-bar-track {
        width: 160px;
        height: 2px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 1px;
        overflow: hidden;
      }
      .splash-bar-fill {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #0d7373, #14a3a3);
        border-radius: 1px;
        animation: splashProgress 2.5s ease-in-out infinite;
      }
      @keyframes splashPulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(1);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.04);
        }
      }
      @keyframes splashProgress {
        0% {
          width: 0;
        }
        50% {
          width: 70%;
        }
        100% {
          width: 100%;
        }
      }

      @media (max-width: 700px) {
        #terminal {
          width: 100%;
          height: 100%;
        }
      }
    </style>
  <link rel="modulepreload" href="/app/teshi-app-68a33871d3362173.js" crossorigin="anonymous" integrity="sha384-x1iCI4sel8iz7LtHZDk/NYcVWuj3QhXmskl8ND6gS4gjDakJKQ0yiWiKsYABiQVn"><link rel="preload" href="/app/teshi-app-68a33871d3362173_bg.wasm" crossorigin="anonymous" integrity="sha384-sPAr5tZBD5xpgNxjP9L+Sq/QDnQNezNyQ1q/GIj5HSYhHKRXaGDjXUczDf+PXDz0" as="fetch" type="application/wasm"></head>
  <body>
    <div id="splash">
      <img
        class="splash-logo"
        src="/images/logo.png"
        alt=""
        width="56"
        height="56"
      />
      <div class="splash-status">loading<span id="dots"></span></div>
      <div class="splash-bar-track"><div class="splash-bar-fill"></div></div>
    </div>

    <div id="terminal">
      <div id="terminal-bar">
        <span class="term-dot"></span>
        <span class="term-dot"></span>
        <span class="term-dot"></span>
        <span id="terminal-title">Teshi — AI Testing Agent</span>
      </div>
      <div id="terminal-body"></div>
    </div>

    
<script type="module">
import init, * as bindings from '/app/teshi-app-68a33871d3362173.js';
const wasm = await init({ module_or_path: '/app/teshi-app-68a33871d3362173_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>

    <script>
      (function () {
        var s = document.getElementById("splash");
        var d = document.getElementById("dots");
        var c = 0;
        setInterval(function () {
          if (d) {
            c = (c + 1) % 4;
            d.textContent = ".".repeat(c);
          }
        }, 400);
        document.addEventListener("DOMContentLoaded", function () {
          setTimeout(function () {
            if (s) s.classList.add("fade");
          }, 300);
        });
        setTimeout(function () {
          if (s && !s.classList.contains("fade")) {
            s.classList.add("fade");
          }
        }, 10000);
      })();
    </script>

    <!-- Forward wheel events to parent when embedded in an iframe -->
    <script>
      (function () {
        try {
          if (window.self === window.top) return;
        } catch (e) {
          return;
        }
        var body = document.getElementById("terminal-body");
        if (!body) return;
        body.addEventListener(
          "wheel",
          function (e) {
            parent.postMessage(
              { type: "__teshi_scroll", deltaY: e.deltaY },
              "*",
            );
          },
          { passive: true },
        );
      })();
    </script>
  </body>
</html>
