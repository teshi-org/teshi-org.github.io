[package]
name = "teshi-app"
version = "0.1.0"
edition = "2024"

[dependencies]
ratzilla = { path = "../vendor/ratzilla" }
# ratatui is pulled in by ratzilla — we access it via ratzilla::ratatui.
# keep as a direct dep with no-default-features for tui-tree-widget compatibility.
ratatui = { version = "0.30", default-features = false, features = ["all-widgets"] }
tui-tree-widget = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ewebsock = "0.8"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "console",
  "EventTarget",
  "Window",
  "Document",
  "DomRect",
  "HtmlElement",
  "Storage",
  "WebSocket",
  "MessageEvent",
  "BinaryType",
  "WheelEvent",
] }
console_error_panic_hook = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
wasm-bindgen-futures = "0.4"
log = "0.4"
wasm-logger = "0.2"
unicode-width = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "s"
lto = true
