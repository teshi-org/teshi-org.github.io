<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d7373" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1816" media="(prefers-color-scheme: dark)">
  <title>404 — Teshi</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Page not found — Teshi AI Testing Agent">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f4efe6;
      color: #2b2622;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-size: clamp(4rem, 12vw, 7rem);
      font-weight: 600;
      line-height: 1;
      background: linear-gradient(135deg, #095555, #14a3a3);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 {
      font-family: Georgia, "Source Serif Pro", "Times New Roman", serif;
      font-size: 1.4rem;
      font-weight: 500;
      margin: 0.5rem 0;
    }
    p {
      color: #6b635a;
      font-size: 0.92rem;
      margin-bottom: 2rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      padding: 0.7rem 2rem;
      background: #2b2622;
      color: #f4efe6;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.9rem;
      transition: background 0.2s, transform 0.2s;
    }
    a:hover { background: #4a3f38; transform: translateY(-1px); }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1816; color: #e8e0d6; }
      p { color: #9c948a; }
      a { background: #1ab0b0; }
      a:hover { background: #2cd4d4; }
    }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  <a href="/">← Back to Teshi</a>
</body>
</html>
