<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="teshi — AI Testing Agent">
    <meta name="theme-color" content="#f4efe6">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="manifest" href="/manifest.json">
    <title>teshi</title>
    <style>
      :root { color: #2b2622; background: #f4efe6; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; }
      body > canvas { display: block; width: 100%; height: 100%; }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f4efe6;
        color: #6b635a;
        font-size: 0.8rem;
        letter-spacing: 0.18em;
      }
      #loading[hidden] { display: none; }
      #loading.error { padding: 2rem; color: #6b2d2d; letter-spacing: normal; text-align: center; }
    </style>
  </head>
  <body>
    <div id="loading" role="status">LOADING TESHI</div>
    <noscript>teshi requires JavaScript and WebAssembly.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
